<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>主入口 | Game Galaxy</title>
    <script src="https://fastly.jsdelivr.net/npm/live2d-widgets@0/autoload.js"></script>
        <style>
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .portal-container {
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .portal-btn {
            background: linear-gradient(45deg, #ff0080, #7928ca);
            border: none;
            padding: 20px 40px;
            margin: 20px;
            border-radius: 30px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .portal-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
        }
        .portal-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }
        .portal-btn:hover::before {
            animation: btnFlow 3s linear infinite;
        }
        @keyframes btnFlow {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <button class="portal-btn" onclick="window.location.href='Introduction.html'">
            🏠 个人主页
        </button>
        <button class="portal-btn" onclick="window.location.href='games/old/'">
            🎮 进入游戏
        </button>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Galaxy | Eternal Beauty</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 字体 */
        @font-face {
            font-family: 'Beautiful';
            src: url('fonts/Beautiful-ES-1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'WhisperFont';
            src: url('fonts/WoYuJianNiHeJuChunQiu-2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #e6e6fa 0%, #d8bfd8 100%);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --text-primary: rgba(80, 50, 90, 0.95);
        }

        body {
            background: var(--primary-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease-out;
        }

        .portal-container {
            position: relative;
            z-index: 1;
            backdrop-filter: blur(12px);
            background: var(--glass-bg);
            border-radius: 20px;
            padding: 2rem 3rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .portal-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 1.25rem 2rem;
            margin: 1rem;
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease-out;
            width: 260px;
            backdrop-filter: blur(6px);
        }

        .portal-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .eternal-text {
            position: fixed;
            bottom: 3rem;
            color: #6a457a;
            font-family: 'Beautiful', cursive;
            font-size: 2.5rem;
            text-align: center;
            line-height: 1.3;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.3);
            max-width: 80%;
            padding: 0 2rem;
            animation: fadeIn 2.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .portal-container {
                padding: 1.5rem;
                width: 85%;
            }

            .portal-btn {
                width: 100%;
                margin: 0.75rem 0;
                font-size: 1rem;
            }

            .eternal-text {
                font-size: 2rem;
                bottom: 2rem;
            }
        }

        /* 新增悄悄话对话框样式 */
        .whisper-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            max-width: 80%;
            min-width: 300px;
            backdrop-filter: blur(8px);
            font-family: 'WhisperFont', cursive;
            display: none;
            opacity: 0;
            animation: fadeInDialog 0.5s forwards;
        }

        @keyframes fadeInDialog {
            0% { opacity: 0; transform: translate(-50%, -40%); }
            100% { opacity: 1; transform: translate(-50%, -50%); }
        }

        .whisper-content {
            font-size: 1.8rem;
            color: #6a457a;
            line-height: 1.6;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            right: 15px;
            top: 10px;
            cursor: pointer;
            font-size: 1.5rem;
            color: #9b72aa;
            transition: transform 0.3s ease;
        }

        .close-btn:hover {
            transform: rotate(90deg) scale(1.2);
            color: #c895d3;
        }

        /* 加载动画 */
        .loader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #9b72aa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 999;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* 背景压暗效果 */
        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            display: none;
            animation: fadeInBackdrop 0.5s forwards;
        }

        @keyframes fadeInBackdrop {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 背景恢复动画 */
        .fade-out-backdrop {
            animation: fadeOutBackdrop 0.5s forwards;
        }

        @keyframes fadeOutBackdrop {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <button class="portal-btn" onclick="window.location.href='Introduction.html'">
            <span>🏠</span> 个人主页
        </button>
        <button class="portal-btn" onclick="window.location.href='Games.html'">
            <span>🎮</span> 一些游戏
        </button>
        <button class="portal-btn" onclick="window.location.href='https://chat-nextgen.vercel.app/'">
            <span>🤖</span> 入机聊天
        </button>
        <button class="portal-btn" onclick="loadWhisper()">
            <span>📝</span> 作者悄悄话
        </button>
    </div>

    <div class="eternal-text">
        Will you still love me when I'm not young and beautiful?
    </div>

    <!-- 背景压暗层 -->
    <div class="backdrop" id="backdrop"></div>

    <!-- 悄悄话对话框 -->
    <div class="whisper-dialog">
        <span class="close-btn">×</span>
        <div class="whisper-content"></div>
    </div>

    <!-- 加载动画 -->
    <div class="loader"></div>

    <script>
        // 显示悄悄话对话框并压暗背景
        function showWhisper(content) {
            const dialog = document.querySelector('.whisper-dialog');
            const backdrop = document.querySelector('.backdrop');
            dialog.querySelector('.whisper-content').innerHTML = content;
            dialog.style.display = 'block';
            backdrop.style.display = 'block';
            document.body.style.overflow = 'hidden'; // 防止滚动
        }

        // 关闭悄悄话对话框并恢复背景
        document.querySelector('.close-btn').addEventListener('click', () => {
            const dialog = document.querySelector('.whisper-dialog');
            const backdrop = document.querySelector('.backdrop');
            dialog.style.display = 'none';
            backdrop.classList.add('fade-out-backdrop');
            document.body.style.overflow = 'auto'; // 恢复滚动
            setTimeout(() => backdrop.style.display = 'none', 500); // 等待动画结束再隐藏
        });

        // 加载悄悄话
        function loadWhisper() {
            const loader = document.querySelector('.loader');
            loader.style.display = 'block';

            fetch('Whisper.txt')
                .then(response => response.text())
                .then(text => {
                    const lines = text.split(/\r?\n/).filter(line => line.trim());
                    if (lines.length === 0) throw new Error('空文件');
                    
                    const randomLine = lines[Math.floor(Math.random() * lines.length)];
                    const rendered = marked.parse(randomLine);
                    showWhisper(rendered);
                })
                .catch(error => {
                    showWhisper('✨ 今日悄悄话正在准备中...');
                    console.error('加载失败:', error);
                })
                .finally(() => {
                    loader.style.display = 'none';
                });
        }
    </script>
</body>
</html>

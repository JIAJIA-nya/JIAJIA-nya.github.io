<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🎮 Game Galaxy | 游戏集合</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 基础动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* 霓虹文字效果 */
        @keyframes neonPulse {
            0%, 100% { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e60073; }
            50% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #e60073; }
        }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* 游戏卡片容器 */
        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 游戏卡片 */
        .game-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, #ff0080, transparent);
            animation: rotate 4s linear infinite;
        }

        /* 音乐播放器 */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 1rem;
            border-radius: 15px;
            display: flex;
            gap: 1rem;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .games-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 动态星空背景 -->
    <div class="stars"></div>

    <h1 style="text-align: center; animation: neonPulse 2s infinite;">🌟 Game Galaxy</h1>
    
    <div class="games-container">
        <!-- 2048 -->
        <div class="game-card" onclick="window.location='games/2048/'">
            <img src="png/2048.ico" alt="2048" style="width: 100px; height: 100px; animation: float 3s infinite;">
            <h2>2048</h2>
            <p>数字合并的终极挑战！</p>
        </div>

        <!-- Flappy Bird -->
        <div class="game-card" onclick="window.location='games/floppybird/'">
            <img src="png/floppybird.png" alt="Flappy Bird" style="width: 100px; height: 100px; animation: float 3s infinite 0.5s;">
            <h2>Flappy Bird</h2>
            <p>穿越障碍的极限操作！</p>
        </div>

        <!-- Tetris -->
        <div class="game-card" onclick="window.location='games/javascript-tetris/'">
            <img src="png/javascript-tetris.jpg" alt="Tetris" style="width: 100px; height: 100px; animation: float 3s infinite 1s;">
            <h2>俄罗斯方块</h2>
            <p>经典永恒的益智游戏！</p>
        </div>

        <!-- Memory Game -->
        <div class="game-card" onclick="window.location='games/memory/'">
            <img src="png/memory.ico" alt="Memory" style="width: 100px; height: 100px; animation: float 3s infinite 1.5s;">
            <h2>记忆挑战</h2>
            <p>考验你的瞬间记忆力！</p>
        </div>

        <!-- 旧游戏合集 -->
        <div class="game-card" onclick="window.location='games/old/'">
            <img src="png/old.png" alt="Old Games" style="width: 100px; height: 100px; animation: float 3s infinite 2s;">
            <h2>经典怀旧</h2>
            <p>重温往日的游戏时光</p>
        </div>
    </div>

    <!-- 高级音乐播放器 -->
    <div class="music-player">
        <audio id="bgm" loop>
            <source src="bgm.mp3" type="audio/mpeg">
            您的浏览器不支持音频播放
        </audio>
        <button onclick="togglePlay()" style="background: none; border: none; color: white; font-size: 1.5rem;">
            <i class="fas fa-play"></i>
        </button>
        <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5" onchange="setVolume(this.value)">
    </div>

    <script>
        // 星空背景生成
        function createStars() {
            const container = document.querySelector('.stars');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.backgroundColor = '#fff';
                star.style.borderRadius = '50%';
                star.style.opacity = Math.random();
                star.style.animation = `twinkle ${Math.random() * 3 + 2}s infinite`;
                container.appendChild(star);
            }
        }

        // 音乐播放控制
        const audio = document.getElementById('bgm');
        let isPlaying = false;

        function togglePlay() {
            isPlaying ? audio.pause() : audio.play();
            isPlaying = !isPlaying;
            document.querySelector('.fa-play').classList.toggle('fa-pause');
        }

        function setVolume(value) {
            audio.volume = value;
        }

        // 初始化
        window.onload = () => {
            createStars();
            // 自动播放音乐（注意：浏览器可能阻止自动播放）
            audio.play().catch(() => console.log('需要用户交互后才能播放音乐'));
        }
    </script>
</body>
</html>
